version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: satria-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-satria}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-satria_password}
      POSTGRES_DB: ${DB_NAME:-satria_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-satria}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - satria-network

  api:
    build: .
    container_name: satria-api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-satria}
      DB_PASSWORD: ${DB_PASSWORD:-satria_password}
      DB_NAME: ${DB_NAME:-satria_db}
      DATABASE_URL: postgresql://${DB_USER:-satria}:${DB_PASSWORD:-satria_password}@postgres:5432/${DB_NAME:-satria_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - satria-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  satria-network:
    driver: bridge
