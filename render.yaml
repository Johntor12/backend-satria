services:
  - type: web
    name: satria-backend
    runtime: node
    repo: https://github.com/Johntor12/backend-satria
    branch: main
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
